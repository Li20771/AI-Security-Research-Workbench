[pytest]
testpaths = tests
pythonpath = .

# Layer 4 is opt-in live connectivity verification (AI-02-B6). It is
# deselected for every run that does not pass `-m layer4` explicitly, so no
# default invocation -- local or CI -- can reach a provider. This is the
# primary mechanism that keeps live checks out of the default gate; a network
# being unreachable is not, and must never be relied on as the barrier.
addopts = -q -m "not layer4"

# Layers are defined in docs/AI-02_MODEL_LAYER_EXECUTION_PLAN.md §12 and
# docs/AI-03_CONTEXT_PLUGIN_EXECUTION_PLAN.md §12.
#
# Layer 0 (repository policy) is not a pytest layer: it is
# scripts/ci/layer0_policy.py, run directly by CI, because it checks the
# repository and the CI configuration rather than Python behaviour.
#
# Layers 1-3 are marked per module. Every test module carries exactly one
# layer marker; scripts/ci/layer0_policy.py enforces that, so a new module
# cannot silently belong to no layer and be skipped.
#
# AI-03 adds no layer 4. The Context plugin has no network surface and no
# opt-in execution path, so there is nothing for a live layer to gate.
markers =
    layer1: contract and schema checks; no transport (offline)
    layer2: behaviour through a fake transport; no network (offline)
    layer3: offline contract fixtures pinned by provenance (offline)
    layer4: opt-in live connectivity verification -- NEVER run by default CI
