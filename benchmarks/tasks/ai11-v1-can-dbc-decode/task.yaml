# AI-11 v1 corpus. Annex A.A.1
#
# The oracle's material is withheld from the agent-visible tree: workspace_setup.exclude
# names control/**, and benchmarks.workspace.verify_exclusions asserts it is absent
# before execution begins (§7.2, §15.3).
#
# This file declares what the task IS. It holds no result, and §5.1 forbids it from
# holding one.

schema_version: 1
task_id: ai11-v1-can-dbc-decode
task_version: 1
task_family: can
difficulty: INTRODUCTORY

source_repository: Li20771/SecurityLab
source_sha: efa836ff9225f6226ca8a76615f3f45c31110d58

workspace_setup:
  include:
    - labs/vehicle/can-basic/demo.dbc
    - task/frame.txt
  exclude:
    - control
  generated: []

task_description: >-
  Decode the CAN frame recorded in task/frame.txt using the DBC at
  labs/vehicle/can-basic/demo.dbc and report the physical value of every signal the DBC
  declares for that frame's arbitration id.


allowed_tools:
  - tool_id: git
    operation: read_file

forbidden_tools:
  - tool_id: terminal
    operation: run
  - tool_id: vehicle_network
    operation: vcan_can_send
  - tool_id: vehicle_network
    operation: vcan_can_dump
  - tool_id: vehicle_network
    operation: isotp_exchange
  - tool_id: vehicle_network
    operation: uds_request
  - tool_id: vehicle_network
    operation: capture_start
  - tool_id: vehicle_network
    operation: capture_stop
  - tool_id: vehicle_network
    operation: replay
  - tool_id: firmware
    operation: qemu
  - tool_id: firmware
    operation: gdb
  - tool_id: firmware
    operation: firmware_unpack

required_preconditions:
  - kind: python_module
    name: cantools


time_budget_seconds: 120

oracle:
  oracle_id: ai11-v1-can-dbc-decode.oracle
  kind: TRACKED_DEFINITION
  required: true
  # The command a person runs to re-derive this oracle's verdict. It is the same
  # entry point the harness uses, so a recorded command is a runnable one.
  reproduce_command: >-
    python3 -m benchmarks.replay ai11-v1-can-dbc-decode --variant known_good --source "$AI11_SOURCE_ROOT"
  expected_negative:
    known_good: control/known_good.json
    known_bad: control/known_bad.json
  success_condition: every declared signal matches its tracked value within the declared tolerance
  material_excluded_from_workspace: true

success_conditions:
  - EngineSpeed matches within tolerance
  - VehicleSpeed matches within tolerance

regression_conditions:
  - condition_id: factor-offset-transposition
    kind: FROZEN_DEFINITION
    reproduce_command: >-
      python3 -m benchmarks.replay ai11-v1-can-dbc-decode --variant known_bad --source "$AI11_SOURCE_ROOT"
    required: true

security_constraints:
  - no operation outside the declared allowed set
  - the source repository is never written
