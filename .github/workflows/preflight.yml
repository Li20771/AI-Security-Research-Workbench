name: preflight

# Layers 0-3 only. Layer 4 (live connectivity verification) is AI-02-B6 and is
# opt-in behind WORKBENCH_LIVE_TESTS; this workflow never invokes it and
# contains no provider endpoint, no HTTP client, and no opt-in flag.
# scripts/ci/layer0_policy.py asserts all four of those, so the guarantee is
# checked rather than promised.
#
# AI-03 adds no layer 4: the Context plugin has no network surface and no
# opt-in execution path, so there is nothing for a live layer to gate. Its
# context build reads only the checked-out workspace, and git is used strictly
# read-only -- asserted by the Layer 0 check above.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-preflight:
    name: "Layer 0 — repository policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Layer 0 — repository policy"
        run: python3 scripts/ci/layer0_policy.py

  provider-tests:
    name: "Layers 1-3 — offline model and context layers"
    runs-on: ubuntu-latest
    # No credentials are provided to this job, by design. Layers 1-3 are
    # offline: a suite that needed an API key could not run here, and
    # requiring one would make the gate untestable in a clean environment.
    #
    # The Context plugin needs git, which actions/checkout has already used.
    # It needs nothing else.
    env:
      DEEPSEEK_API_KEY: ""
      MIMO_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: |
          python -m compileall -q providers plugins tests agents integrations review benchmarks workflows

      - name: "Layer 1 — contract and schema"
        run: |
          python -m providers.validate
          python -m plugins.context.validate
          python -m pytest -m layer1

      - name: "Layer 2 — fake-transport unit tests"
        run: |
          python -m pytest -m layer2

      - name: "Layer 3 — offline contract fixtures"
        run: |
          python -m pytest -m layer3

      - name: "Layer 4 — live connectivity verification"
        run: |
          echo "Layer 4 = NOT_RUN"
          echo
          echo "Live connectivity verification is AI-02-B6. It is opt-in only: it"
          echo "requires WORKBENCH_LIVE_TESTS and a resolvable credential, and it"
          echo "is the only layer permitted to promote a capability to VERIFIED."
          echo "This workflow does none of that, so no live check ran."
          echo
          echo "NOT_RUN != PASS. This run promotes no capability and is not"
          echo "evidence about either provider."

      - name: Layer status
        run: |
          echo "Layer 0 — repository policy ................ EXECUTED"
          echo "Layer 1 — contract and schema .............. EXECUTED"
          echo "Layer 2 — fake-transport unit tests ........ EXECUTED"
          echo "Layer 3 — offline contract fixtures ........ EXECUTED"
          echo "Layer 4 — live connectivity verification ... NOT_RUN (opt-in only)"
          echo
          echo "AI-03 adds no layer 4. The Context plugin is offline by"
          echo "construction: it reads one workspace, uses git read-only, and"
          echo "reaches no network."

      - name: Confirm the suite ran without credentials
        run: |
          test -z "${DEEPSEEK_API_KEY:-}"
          test -z "${MIMO_API_KEY:-}"
          echo "layers 0-3 validated and tested with no credential present"
