name: live model verification

# AI-02-B6. Layer 4: opt-in live connectivity verification.
#
# This workflow is the ONLY place a provider is contacted, and it is manual.
# It has no push or pull_request trigger, so it is never part of the default
# pipeline. scripts/ci/layer0_policy.py enforces that structurally.
#
# A run produces an evidence artefact and nothing else. It does not commit, it
# does not modify a profile, and it does not promote a capability: promotion is
# a separate, reviewed human action (§22).

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: "Provider to verify. Must be in the live-test allowlist."
        required: true
        type: choice
        options:
          - deepseek
          - mimo
      model_ref:
        description: "Registered model ref, e.g. deepseek/deepseek-flash"
        required: true
        type: string
      experiment_id:
        description: "Optional experiment id to attach to the evidence record"
        required: false
        type: string

# Read-only. There is no write scope, so no step in this workflow can push a
# change even if one tried.
permissions:
  contents: read

jobs:
  live-verification:
    name: "Layer 4 — live connectivity verification"
    runs-on: ubuntu-latest

    # Deliberately NOT job-level: a credential is available to the probe step
    # and to nothing else. Checkout, the Python setup, pip install, the
    # pre-check, the report, and the artefact upload all run without one.
    #
    # These values reach the shell as environment variables and are expanded
    # quoted. A `${{ inputs.x }}` interpolated straight into a command line is
    # how a workflow_dispatch input becomes shell syntax.
    env:
      WORKBENCH_LIVE_TESTS: "1"
      PROVIDER_ID: ${{ inputs.provider_id }}
      MODEL_REF: ${{ inputs.model_ref }}
      EXPERIMENT_ID: ${{ inputs.experiment_id }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Confirm this workflow is the explicit opt-in path
        run: |
          test "${WORKBENCH_LIVE_TESTS}" = "1"
          echo "opt-in flag present: live verification is explicitly enabled"
          echo "provider: ${PROVIDER_ID}"

      - name: "Layer 4 — live verification probe"
        env:
          # The only step that receives a credential.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          args=(--provider "$PROVIDER_ID" --model-ref "$MODEL_REF")
          if [ -n "$EXPERIMENT_ID" ]; then
            args+=(--experiment-id "$EXPERIMENT_ID")
          fi

          # `set +e` so the runner's exit code is captured rather than
          # aborting the step. It is then interpreted explicitly below.
          set +e
          python scripts/live/run_live_verification.py "${args[@]}"
          rc=$?
          set -e

          case "$rc" in
            0)
              echo "probe executed; PASS or FAIL is in the evidence record"
              ;;
            2)
              echo "probe BLOCKED — a precondition failed; no network activity occurred"
              ;;
            3)
              echo "probe NOT_RUN — the opt-in flag was absent; no network activity occurred"
              ;;
            *)
              # An unexpected exit code is a runner failure, not a probe
              # result. It fails the job rather than being absorbed: a crash
              # silently reported as success is worse than a red build.
              echo "::error::live probe runner failed unexpectedly (exit $rc)"
              exit "$rc"
              ;;
          esac

      - name: Report the result and its meaning
        run: |
          echo "Layer 4 = EXECUTED"
          echo
          echo "A live run promotes nothing. Capabilities carry a candidate"
          echo "status in the evidence record, and applying it to a profile is a"
          echo "separate reviewed change."

      - name: Upload the evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification-evidence
          path: evidence/runs/*.yaml
          if-no-files-found: warn
          retention-days: 90
