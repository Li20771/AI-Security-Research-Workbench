# MiMo Flash model profile.
#
# Status: DECLARED identity only. Nothing here is VERIFIED.
#
# This profile records what is *known to be recorded*, and nothing more. Every
# capability is UNKNOWN, every limit is null, and provenance is empty, because
# the Workbench has observed none of it. AI-02-B6 is the only phase permitted
# to promote a capability, and only from a dated observation.
#
# Do not fill these in to make the profile look complete. `declared: null` with
# `status: UNKNOWN` means nobody knows; it does not mean false. A guessed
# context limit is worse than an absent one, because it silently truncates real
# work (§6.5).
#
# Flash and Pro share a family and version and differ by nothing recorded here.
# That is deliberate: this profile asserts no capability, so it cannot claim
# that one tier is faster, cheaper, or weaker than the other. Any such claim
# needs evidence, and AI-11 is where it would be measured (§6.3).
#
# model_id is the API model id, sent verbatim. display_name is human-facing and
# is never sent. The two are independent records, NOT a derivation (§6.3).

